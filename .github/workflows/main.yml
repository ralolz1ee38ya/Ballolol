name: Roblox update tracker

on:
  schedule:
    # GitHub-hosted runners cannot run indefinitely. Start a fresh run every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-update-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: roblox_state.json
          key: roblox-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: roblox-state-

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHECK_INTERVAL: "60"
        # Stop before the job limit so the state-save step can run.
        run: timeout --signal=INT --kill-after=30s 340m python roblox_tracker.py
        continue-on-error: true

      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: roblox_state.json
          key: roblox-state-${{ github.run_id }}-${{ github.run_attempt }}
